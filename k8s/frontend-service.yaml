apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: default
spec:
  # NodePort makes the service accessible from outside the cluster
  # via <EC2_IP>:<nodePort>
  type: NodePort
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80           # ClusterIP port (internal)
      targetPort: 8080   # Container port
      nodePort: 30080    # External port (access via http://<EC2_IP>:30080)

